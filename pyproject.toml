[project]
name = "xfq-cli"
version = "0.1.0"
description = "小番茄图片混淆的命令行工具：批量混淆与解混淆，输出无损 PNG"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "pillow>=10",
    "numpy>=1.24",
]

[project.scripts]
xfq = "xfq.cli:main"

[project.urls]
Repository = "https://github.com/Miint-Sunny/xfq-cli"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xfq"]
